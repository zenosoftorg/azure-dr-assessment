name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      DR_BROWSER_FLAGS: --no-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Check the pattern pack
        run: npm run lint:patterns
      - name: Check the service playbooks
        run: npm run lint:playbooks
      - name: Run the tests
        run: npm test
